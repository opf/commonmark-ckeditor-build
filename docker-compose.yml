x-op-node: &op-node
  image: node:lts
  working_dir: /home/node/app
  volumes:
    - ./:/home/node/app
    # Optional: the absolute path to the core repository, set in `.env`.
    # A build is then copied over the package core installed from npm.
    - ${OPENPROJECT_CORE:-/tmp}/frontend/node_modules/@openproject/commonmark-ckeditor-build:/openproject/frontend/node_modules/@openproject/commonmark-ckeditor-build
  environment:
    OPENPROJECT_CORE: /openproject

services:
  install:
    <<: *op-node
    command: npm install

  build:
    <<: *op-node
    command: npm run build

  watch:
    <<: *op-node
    command: npm run watch
