name: Check for changeset

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      # For `skip changeset` only.
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read # the action lists the pull request's files

jobs:
  check-for-changeset:
    name: Check for changeset
    # The Release Tracking pull request consumes changesets instead of adding
    # one. A fork controls its branch name, so exempt only the bot's branch in
    # this repository.
    if: >-
      ${{ !(github.head_ref == 'changeset-release/master'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check for changeset
        uses: brettcannon/check-for-changed-files@v1.2.1
        with:
          # Every changeset, but not the permanent README next to them.
          file-pattern: '.changeset/!(README).md'
          skip-label: 'skip changeset'
          failure-message: 'No changeset found. Run `npm run changeset` and commit the result, or apply the ${skip-label} label if this change does not affect the published build.'
